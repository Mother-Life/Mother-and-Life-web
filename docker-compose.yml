services:
  postgres:
    image: postgres:16-alpine
    container_name: motherandlife-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: motherandlife
    volumes:
      - motherandlife_pgdata:/var/lib/postgresql/data

volumes:
  motherandlife_pgdata:
